<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Claude Search Library</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%230a0e12'/%3E%3Ctext x='50' y='68' font-size='60' font-family='monospace' text-anchor='middle' fill='%23f0a500'%3E%3E%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Command-center theme: near-black bg, elevated dark-gray surfaces, a
    // single amber accent (operational-status feel, not neon), hairline
    // low-opacity borders, mono for data/metadata + sans for UI chrome.
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: "#0a0e12",
            surface: "#161b22",
            surface2: "#1c222b",
            accent: "#f0a500",
            primary: "#e6edf3",
            muted: "#8b949e",
            hairline: "rgba(255,255,255,0.08)",
            hairline2: "rgba(255,255,255,0.16)",
            danger: "#f85149",
            success: "#3fb950",
          },
          fontFamily: {
            sans: ['"Inter"', "ui-sans-serif", "system-ui", "sans-serif"],
            mono: ['"JetBrains Mono"', "ui-monospace", "SFMono-Regular", "monospace"],
          },
        },
      },
    };
  </script>
  <script src="../src/api.js"></script>
  <style>
    /* Touch-friendly minimum target size on top of Tailwind utility classes. */
    button, input, select {
      min-height: 44px;
    }
    body {
      /* Very low-opacity grid texture for the "ops dashboard" feel - kept
         subtle enough it never competes with readability. */
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 32px 32px;
    }
    /* Flat, sharp-edged focus glow instead of a default browser outline -
       small radius, no heavy shadow, matches the brief's "quietly powerful"
       tone rather than a skeuomorphic glow. */
    input:focus, select:focus, textarea:focus {
      outline: none;
      box-shadow: 0 0 0 2px rgba(240, 165, 0, 0.35);
      border-color: #f0a500 !important;
    }
  </style>
</head>
<body class="bg-bg text-primary font-sans">
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useCallback, useRef } = React;
    // Named apiClient, not api - src/api.js's own top-level `const api = {...}`
    // shares this same global lexical scope (separate <script> tags don't
    // sandbox let/const/class declarations from each other in browsers), so
    // reusing the name `api` here throws "Identifier 'api' has already been
    // declared" the instant this script parses. Found via an actual browser
    // load - this went undetected until server.py finally served this page.
    const apiClient = window.ClaudeSearchAPI;

    const LOCAL_STORAGE_KEY = "claude-search-library:unlocked";

    function useDebouncedValue(value, delayMs) {
      const [debounced, setDebounced] = useState(value);
      useEffect(() => {
        const timer = setTimeout(() => setDebounced(value), delayMs);
        return () => clearTimeout(timer);
      }, [value, delayMs]);
      return debounced;
    }

    function Header({ view, onNavigate, onLock }) {
      return (
        <header className="sticky top-0 z-10 bg-surface/95 backdrop-blur border-b border-hairline px-4 py-3 flex items-center justify-between">
          <h1 className="text-lg font-semibold tracking-tight">
            <span className="text-accent font-mono">&gt;</span> Claude Search Library
          </h1>
          <nav className="flex gap-2">
            <button
              className={`px-3 py-2 rounded text-sm transition-colors ${view === "search" ? "bg-accent text-bg font-medium" : "bg-surface2 text-muted hover:text-primary"}`}
              onClick={() => onNavigate("search")}
            >
              Search
            </button>
            <button
              className={`px-3 py-2 rounded text-sm transition-colors ${view === "devices" ? "bg-accent text-bg font-medium" : "bg-surface2 text-muted hover:text-primary"}`}
              onClick={() => onNavigate("devices")}
            >
              Sync
            </button>
            <button className="px-3 py-2 rounded text-sm bg-surface2 text-muted hover:text-primary transition-colors" onClick={onLock}>
              Lock
            </button>
          </nav>
        </header>
      );
    }

    function SetupPage({ onUnlocked }) {
      const [passphrase, setPassphrase] = useState("");
      const [totpCode, setTotpCode] = useState("");
      const [error, setError] = useState(null);
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError(null);
        setLoading(true);
        try {
          const result = await apiClient.setup(passphrase, totpCode);
          if (result.success) {
            // Only a "device verified" flag is persisted locally - never the
            // passphrase or any derived key. Re-entering the passphrase per
            // session is the trade-off for not storing secrets in the browser.
            window.localStorage.setItem(LOCAL_STORAGE_KEY, "true");
            onUnlocked();
          } else {
            setError(result.error || "Setup failed");
          }
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center px-4">
          <form onSubmit={handleSubmit} className="w-full max-w-sm bg-surface border border-hairline rounded-lg p-6 space-y-4">
            <h2 className="text-xl font-semibold text-center">
              <span className="text-accent font-mono">&gt;</span> Unlock Device
            </h2>
            <p className="text-sm text-muted text-center">
              Enter your master passphrase and Authenticator code. Nothing is sent to the server except a verification check.
            </p>
            <div>
              <label className="block text-sm font-medium mb-1 text-muted" htmlFor="passphrase">
                Master passphrase
              </label>
              <input
                id="passphrase"
                type="password"
                autoComplete="off"
                className="w-full bg-surface2 border border-hairline2 rounded px-3 py-2 search-box"
                value={passphrase}
                onChange={(e) => setPassphrase(e.target.value)}
                required
              />
            </div>
            <div>
              <label className="block text-sm font-medium mb-1 text-muted" htmlFor="totp">
                Authenticator code
              </label>
              <input
                id="totp"
                type="text"
                inputMode="numeric"
                pattern="[0-9]{6}"
                maxLength={6}
                className="w-full bg-surface2 border border-hairline2 rounded px-3 py-2 tracking-widest text-center font-mono"
                value={totpCode}
                onChange={(e) => setTotpCode(e.target.value.replace(/\D/g, ""))}
                required
              />
            </div>
            {error && <p className="text-sm text-danger">{error}</p>}
            <button
              type="submit"
              disabled={loading}
              className="w-full bg-accent text-bg rounded py-2 font-medium disabled:opacity-50 hover:brightness-110 transition"
            >
              {loading ? "Verifying…" : "Setup Device"}
            </button>
          </form>
        </div>
      );
    }

    // sessionStorage, not localStorage: cleared when the tab/browser closes,
    // never written to disk long-term. Holds the passphrase only - never a
    // TOTP code (those are ~30s one-time codes, caching one is pointless)
    // and never the derived encryption key itself (server.py still derives
    // that fresh per /sync call - see resolve_encryption_key's docstring).
    // This narrows re-auth friction to "one fresh TOTP code per sync" instead
    // of "passphrase + TOTP every time", while keeping the actual security
    // property (a live TOTP proof still required every call) intact.
    const SESSION_PASSPHRASE_KEY = "claude-search-library:session-passphrase";

    function CredentialModal({ title, actionLabel, onSubmit, onClose }) {
      const [passphrase, setPassphrase] = useState(
        () => window.sessionStorage.getItem(SESSION_PASSPHRASE_KEY) || ""
      );
      const [rememberedPassphrase] = useState(() => Boolean(window.sessionStorage.getItem(SESSION_PASSPHRASE_KEY)));
      const [totpCode, setTotpCode] = useState("");
      const [submitting, setSubmitting] = useState(false);
      const [error, setError] = useState(null);

      const forgetPassphrase = () => {
        window.sessionStorage.removeItem(SESSION_PASSPHRASE_KEY);
        setPassphrase("");
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError(null);
        setSubmitting(true);
        try {
          await onSubmit(passphrase, totpCode);
          // Only cache on success - an unconfirmed passphrase has no
          // business being remembered, even for one tab session.
          window.sessionStorage.setItem(SESSION_PASSPHRASE_KEY, passphrase);
        } catch (err) {
          // resolve_encryption_key() deliberately never says which factor
          // was wrong (see crypto.py), so on any failure the safest default
          // is to drop the cached passphrase and ask for both fields again,
          // rather than silently retrying a possibly-wrong cached value.
          window.sessionStorage.removeItem(SESSION_PASSPHRASE_KEY);
          setError(err.message);
          setSubmitting(false);
          return;
        }
        setSubmitting(false);
      };

      return (
        <div className="modal-overlay fixed inset-0 bg-black/60 flex items-center justify-center z-30 p-4">
          <form onSubmit={handleSubmit} className="modal bg-surface border border-hairline rounded-lg w-full max-w-sm p-6 space-y-4">
            <div className="flex items-center justify-between">
              <h2 className="text-lg font-semibold">{title}</h2>
              <button type="button" className="text-muted hover:text-primary text-2xl leading-none transition-colors" onClick={onClose} aria-label="Close">
                &times;
              </button>
            </div>
            <p className="text-sm text-muted">
              {rememberedPassphrase
                ? "Using this browser tab's remembered passphrase — a fresh authenticator code is still required every time."
                : "Required every time — nothing is cached between requests. See ROADMAP.md #7 for why."}
            </p>
            {rememberedPassphrase ? (
              <p className="text-xs text-muted">
                <button type="button" className="text-accent hover:underline" onClick={forgetPassphrase}>
                  Use a different passphrase
                </button>
              </p>
            ) : (
              <div>
                <label className="block text-sm font-medium mb-1 text-muted" htmlFor="sync-passphrase">
                  Master passphrase
                </label>
                <input
                  id="sync-passphrase"
                  type="password"
                  autoComplete="off"
                  className="w-full bg-surface2 border border-hairline2 rounded px-3 py-2"
                  value={passphrase}
                  onChange={(e) => setPassphrase(e.target.value)}
                  required
                  autoFocus
                />
              </div>
            )}
            <div>
              <label className="block text-sm font-medium mb-1 text-muted" htmlFor="sync-totp">
                Authenticator code
              </label>
              <input
                id="sync-totp"
                type="text"
                inputMode="numeric"
                pattern="[0-9]{6}"
                maxLength={6}
                className="w-full bg-surface2 border border-hairline2 rounded px-3 py-2 tracking-widest text-center font-mono"
                value={totpCode}
                onChange={(e) => setTotpCode(e.target.value.replace(/\D/g, ""))}
                required
                autoFocus={rememberedPassphrase}
              />
            </div>
            {error && <p className="text-sm text-danger">{error}</p>}
            <div className="flex gap-2 justify-end">
              <button type="button" className="px-4 py-2 rounded text-sm bg-surface2 text-muted hover:text-primary transition-colors" onClick={onClose}>
                Cancel
              </button>
              <button
                type="submit"
                disabled={submitting}
                className="px-4 py-2 rounded text-sm bg-accent text-bg disabled:opacity-50 hover:brightness-110 transition"
              >
                {submitting ? "Working…" : actionLabel}
              </button>
            </div>
          </form>
        </div>
      );
    }

    // Kept in sync with src/orchestration.py's SOURCES tuple - update this
    // list whenever a new collector source is registered there.
    const SOURCE_OPTIONS = [
      { value: "claude-code", label: "Claude Code" },
      { value: "claude-ai", label: "Claude.ai" },
      { value: "vscode", label: "VS Code" },
      { value: "cowork", label: "Cowork" },
      { value: "local", label: "Local" },
    ];

    function FilterPanel({ filters, onChange }) {
      return (
        <div className="filter-panel bg-surface rounded-lg border border-hairline p-4 space-y-3">
          <div>
            <label className="block text-xs font-medium text-muted mb-1">Source</label>
            <select
              className="w-full bg-surface2 border border-hairline2 rounded px-2 py-2 text-sm"
              value={filters.source || ""}
              onChange={(e) => onChange({ ...filters, source: e.target.value || undefined })}
            >
              <option value="">Any</option>
              {SOURCE_OPTIONS.map((s) => (
                <option key={s.value} value={s.value}>{s.label}</option>
              ))}
            </select>
          </div>
          <div>
            <label className="block text-xs font-medium text-muted mb-1">Device</label>
            <select
              className="w-full bg-surface2 border border-hairline2 rounded px-2 py-2 text-sm"
              value={filters.device || ""}
              onChange={(e) => onChange({ ...filters, device: e.target.value || undefined })}
            >
              <option value="">Any</option>
              <option value="desktop">Desktop</option>
              <option value="laptop">Laptop</option>
              <option value="phone">Phone</option>
            </select>
          </div>
          <div>
            <label className="block text-xs font-medium text-muted mb-1">Tags (comma-separated)</label>
            <input
              type="text"
              className="w-full bg-surface2 border border-hairline2 rounded px-2 py-2 text-sm"
              value={filters.tags || ""}
              onChange={(e) => onChange({ ...filters, tags: e.target.value || undefined })}
              placeholder="minecraft, debugging"
            />
          </div>
          <div className="grid grid-cols-2 gap-2">
            <div>
              <label className="block text-xs font-medium text-muted mb-1">From</label>
              <input
                type="date"
                className="w-full bg-surface2 border border-hairline2 rounded px-2 py-2 text-sm"
                value={filters.dateStart || ""}
                onChange={(e) => onChange({ ...filters, dateStart: e.target.value || undefined })}
              />
            </div>
            <div>
              <label className="block text-xs font-medium text-muted mb-1">To</label>
              <input
                type="date"
                className="w-full bg-surface2 border border-hairline2 rounded px-2 py-2 text-sm"
                value={filters.dateEnd || ""}
                onChange={(e) => onChange({ ...filters, dateEnd: e.target.value || undefined })}
              />
            </div>
          </div>
        </div>
      );
    }

    function ResultCard({ result, onViewDetails }) {
      return (
        <div className="result-card bg-surface rounded-lg border border-hairline p-4 hover:border-accent/40 transition-colors">
          <div className="flex items-start justify-between gap-2">
            <h3 className="font-semibold text-base">{result.title || "(untitled session)"}</h3>
            <span className="text-xs shrink-0 bg-surface2 text-accent font-mono rounded px-2 py-1">
              {(result.relevance_score * 100).toFixed(0)}%
            </span>
          </div>
          {result.tldr && <p className="text-sm text-muted mt-1">{result.tldr}</p>}
          <div className="flex flex-wrap gap-x-3 gap-y-1 mt-2 text-xs text-muted font-mono">
            <span>{result.source}{result.device ? ` · ${result.device}` : ""}</span>
            {result.created_at && <span>{new Date(result.created_at).toLocaleDateString()}</span>}
            {result.search_type && <span className="italic">via {result.search_type}</span>}
          </div>
          {result.top_pattern && (
            <p className="text-xs text-muted mt-2 italic">"{result.top_pattern}"</p>
          )}
          <button
            className="mt-3 text-sm font-medium text-accent hover:underline"
            onClick={() => onViewDetails(result.session_id)}
          >
            View Details →
          </button>
        </div>
      );
    }

    function SessionDetailModal({ sessionId, onClose }) {
      const [detail, setDetail] = useState(null);
      const [error, setError] = useState(null);

      useEffect(() => {
        let cancelled = false;
        apiClient
          .getSession(sessionId)
          .then((data) => !cancelled && setDetail(data))
          .catch((err) => !cancelled && setError(err.message));
        return () => {
          cancelled = true;
        };
      }, [sessionId]);

      return (
        <div className="modal-overlay fixed inset-0 bg-black/60 flex items-end sm:items-center justify-center z-20 p-0 sm:p-4">
          <div className="modal bg-surface border border-hairline rounded-t-lg sm:rounded-lg w-full sm:max-w-lg max-h-[85vh] overflow-y-auto p-5">
            <div className="flex items-center justify-between mb-3">
              <h2 className="text-lg font-semibold">{detail?.title || "Session"}</h2>
              <button className="text-muted hover:text-primary text-2xl leading-none transition-colors" onClick={onClose} aria-label="Close">
                &times;
              </button>
            </div>

            {error && <p className="text-sm text-danger">{error}</p>}
            {!detail && !error && <p className="text-sm text-muted">Loading…</p>}

            {detail && (
              <div className="space-y-4 text-sm">
                {detail.summary?.tldr && (
                  <p className="text-primary/90">{detail.summary.tldr}</p>
                )}

                <div className="flex flex-wrap gap-x-3 text-xs text-muted font-mono">
                  <span>Source: {detail.source}</span>
                  <span>Device: {detail.device}</span>
                  <span>Created: {detail.created_at}</span>
                </div>

                {detail.summary?.learnings?.length > 0 && (
                  <div>
                    <h3 className="font-medium mb-1 text-muted">Learnings</h3>
                    <ul className="list-disc list-inside space-y-1">
                      {detail.summary.learnings.map((l, i) => (
                        <li key={i}>{l}</li>
                      ))}
                    </ul>
                  </div>
                )}

                {detail.summary?.patterns?.length > 0 && (
                  <div>
                    <h3 className="font-medium mb-1 text-muted">Patterns</h3>
                    <ul className="list-disc list-inside space-y-1">
                      {detail.summary.patterns.map((p, i) => (
                        <li key={i}>{p}</li>
                      ))}
                    </ul>
                  </div>
                )}

                {detail.summary?.tags?.length > 0 && (
                  <div className="flex flex-wrap gap-1">
                    {detail.summary.tags.map((t, i) => (
                      <span key={i} className="bg-surface2 text-muted rounded-full px-2 py-1 text-xs font-mono">
                        {t}
                      </span>
                    ))}
                  </div>
                )}

                {detail.link_to_raw ? (
                  <a
                    href={detail.link_to_raw}
                    className="inline-block text-accent text-sm hover:underline"
                  >
                    View raw chat file
                  </a>
                ) : (
                  <p className="text-xs text-muted italic">
                    Raw conversation text has been pruned (summary retained) — see `cli.py prune`.
                  </p>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    function buildApiFilters(filters) {
      const out = {};
      if (filters.source) out.source = filters.source;
      if (filters.device) out.device = filters.device;
      if (filters.tags) out.tags = filters.tags.split(",").map((t) => t.trim()).filter(Boolean);
      if (filters.dateStart || filters.dateEnd) {
        out.date_range = { start: filters.dateStart, end: filters.dateEnd };
      }
      return out;
    }

    function SearchPage() {
      const [query, setQuery] = useState("");
      const [mode, setMode] = useState("hybrid");
      const [filters, setFilters] = useState({});
      const [results, setResults] = useState([]);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [selectedSessionId, setSelectedSessionId] = useState(null);
      const debouncedQuery = useDebouncedValue(query, 300);

      useEffect(() => {
        if (!debouncedQuery.trim()) {
          setResults([]);
          return;
        }
        let cancelled = false;
        setLoading(true);
        setError(null);
        apiClient
          .search(debouncedQuery, { top_k: 20, mode, filters: buildApiFilters(filters) })
          .then((data) => !cancelled && setResults(data))
          .catch((err) => !cancelled && setError(err.message))
          .finally(() => !cancelled && setLoading(false));
        return () => {
          cancelled = true;
        };
      }, [debouncedQuery, mode, filters]);

      return (
        <div className="max-w-3xl mx-auto px-4 py-6 space-y-4">
          <div className="search-container flex gap-2">
            <div className="relative flex-1">
              <span className="absolute left-3 top-1/2 -translate-y-1/2 text-accent font-mono pointer-events-none">
                &gt;
              </span>
              <input
                type="search"
                className="search-box w-full bg-surface border border-hairline2 rounded-lg pl-8 pr-4 py-3 text-base font-mono placeholder:text-muted placeholder:font-sans"
                placeholder="Search your chat history…"
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                autoFocus
              />
            </div>
            <select
              id="search-mode"
              className="bg-surface border border-hairline2 rounded-lg px-2 text-sm shrink-0"
              value={mode}
              onChange={(e) => setMode(e.target.value)}
              aria-label="Search mode"
            >
              <option value="hybrid">Hybrid (Recommended)</option>
              <option value="semantic">Semantic (Smart)</option>
              <option value="keyword">Keyword (Fast)</option>
            </select>
          </div>

          <details className="sm:hidden">
            <summary className="text-sm font-medium text-muted cursor-pointer">Filters</summary>
            <div className="mt-2">
              <FilterPanel filters={filters} onChange={setFilters} />
            </div>
          </details>

          <div className="hidden sm:grid sm:grid-cols-[220px_1fr] gap-4 items-start">
            <FilterPanel filters={filters} onChange={setFilters} />
            <ResultsColumn />
          </div>

          <div className="sm:hidden">
            <ResultsColumn />
          </div>

          {selectedSessionId && (
            <SessionDetailModal sessionId={selectedSessionId} onClose={() => setSelectedSessionId(null)} />
          )}
        </div>
      );

      function ResultsColumn() {
        if (loading) return <p className="text-sm text-muted font-mono">Searching…</p>;
        if (error) return <p className="text-sm text-danger">{error}</p>;
        if (!query.trim()) return <p className="text-sm text-muted/70">Start typing to search.</p>;
        if (results.length === 0) return <p className="text-sm text-muted/70">No results found.</p>;

        return (
          <div className="space-y-3">
            {results.map((r) => (
              <ResultCard key={r.session_id} result={r} onViewDetails={setSelectedSessionId} />
            ))}
          </div>
        );
      }
    }

    function HealthBadge({ health }) {
      if (!health) return null;
      const healthy = health.healthy;
      const [expanded, setExpanded] = useState(false);
      const details = [...(health.errors || []), ...(health.warnings || [])];

      return (
        <div className="relative">
          <button
            type="button"
            onClick={() => details.length > 0 && setExpanded((v) => !v)}
            className={`text-xs rounded-full px-2 py-1 font-medium transition-colors ${
              healthy ? "bg-success/15 text-success" : "bg-danger/15 text-danger hover:bg-danger/25"
            } ${details.length > 0 ? "cursor-pointer" : "cursor-default"}`}
          >
            {healthy ? "Healthy" : `Unhealthy${details.length ? " ▾" : ""}`}
          </button>
          {expanded && details.length > 0 && (
            <div className="absolute right-0 mt-2 w-72 bg-surface border border-hairline2 rounded-lg shadow-lg p-3 z-40 text-xs space-y-1">
              {(health.errors || []).map((e, i) => (
                <p key={`e${i}`} className="text-danger">{e}</p>
              ))}
              {(health.warnings || []).map((w, i) => (
                <p key={`w${i}`} className="text-accent">{w}</p>
              ))}
            </div>
          )}
        </div>
      );
    }

    function ImportDropzone({ onImported }) {
      const [dragging, setDragging] = useState(false);
      const [busy, setBusy] = useState(false);
      const [message, setMessage] = useState(null);
      const fileInputRef = useRef(null);

      // The real converter (src/claude_export_import.py, via /import-export)
      // handles both the real official export ZIP and a bare
      // conversations.json - no client-side parsing/flattening needed
      // anymore, and it understands the actual official schema
      // (uuid/name/chat_messages[]/sender/text), unlike the old client-side
      // flatten which only worked for already-pre-normalized JSON.
      const handleFiles = async (fileList) => {
        setBusy(true);
        setMessage(null);
        try {
          const files = Array.from(fileList).filter(
            (f) => f.name.endsWith(".json") || f.name.endsWith(".zip")
          );
          if (files.length === 0) {
            throw new Error("Drop a .zip (Settings → Export data) or conversations.json file");
          }
          let converted = 0;
          for (const file of files) {
            const result = await apiClient.importExport(file);
            converted += result.converted;
          }
          setMessage(`Converted ${converted} conversation(s). Run "cli.py collect" to process them.`);
          onImported();
        } catch (err) {
          setMessage(err.message);
        } finally {
          setBusy(false);
        }
      };

      return (
        <div
          className={`rounded-lg border-2 border-dashed p-6 text-center transition-colors ${
            dragging ? "border-accent bg-accent/5" : "border-hairline2"
          }`}
          onDragOver={(e) => {
            e.preventDefault();
            setDragging(true);
          }}
          onDragLeave={() => setDragging(false)}
          onDrop={(e) => {
            e.preventDefault();
            setDragging(false);
            handleFiles(e.dataTransfer.files);
          }}
        >
          <p className="text-sm text-muted">
            Drop your claude.ai export (.zip or .json) here, or{" "}
            <button
              type="button"
              className="text-accent hover:underline"
              onClick={() => fileInputRef.current?.click()}
              disabled={busy}
            >
              browse
            </button>
          </p>
          <input
            ref={fileInputRef}
            type="file"
            accept=".json,.zip"
            multiple
            className="hidden"
            onChange={(e) => e.target.files.length > 0 && handleFiles(e.target.files)}
          />
          {busy && <p className="text-xs text-muted mt-2">Importing…</p>}
          {message && <p className="text-xs text-muted mt-2">{message}</p>}
        </div>
      );
    }

    function DevicesPage() {
      const [devices, setDevices] = useState([]);
      const [stats, setStats] = useState(null);
      const [health, setHealth] = useState(null);
      const [costs, setCosts] = useState(null);
      const [error, setError] = useState(null);
      const [refreshing, setRefreshing] = useState(false);
      const [activeModal, setActiveModal] = useState(null); // "push" | "pull" | "bidirectional" | null
      const [syncMessage, setSyncMessage] = useState(null);

      const load = useCallback(() => {
        setError(null);
        Promise.all([
          apiClient.getDevices(),
          apiClient.getStats(),
          apiClient.getHealth().catch(() => null),
          apiClient.getCosts().catch(() => null),
        ])
          .then(([d, s, h, c]) => {
            setDevices(d);
            setStats(s);
            setHealth(h);
            setCosts(c);
          })
          .catch((err) => setError(err.message));
      }, []);

      useEffect(() => {
        load();
      }, [load]);

      const handleRefresh = async () => {
        setRefreshing(true);
        try {
          load();
        } finally {
          setRefreshing(false);
        }
      };

      const handleSyncSubmit = async (passphrase, totpCode) => {
        const direction = activeModal;
        const result = await apiClient.sync(passphrase, totpCode, direction);
        setSyncMessage(
          `${direction}: ${result.files_changed} file(s) changed, ${result.reindexed || 0} reindexed` +
            (result.conflicts ? `, ${result.conflicts} conflict(s)` : "")
        );
        setActiveModal(null);
        load();
      };

      const syncButtons = [
        { direction: "pull", label: "Pull" },
        { direction: "push", label: "Push" },
        { direction: "bidirectional", label: "Sync Now" },
      ];

      return (
        <div className="max-w-2xl mx-auto px-4 py-6 space-y-4">
          <div className="device-status bg-surface rounded-lg border border-hairline p-4 space-y-3">
            <div className="flex items-center justify-between">
              <div>
                <p className="text-sm text-muted">Last sync</p>
                <p className="font-medium font-mono">{stats?.last_sync || "Never"}</p>
              </div>
              <div className="flex items-center gap-2">
                <HealthBadge health={health} />
                <button
                  className="bg-surface2 text-muted hover:text-primary transition-colors rounded px-3 py-2 text-sm disabled:opacity-50"
                  onClick={handleRefresh}
                  disabled={refreshing}
                >
                  {refreshing ? "Refreshing…" : "Refresh"}
                </button>
              </div>
            </div>
            <div className="flex gap-2">
              {syncButtons.map((b) => (
                <button
                  key={b.direction}
                  className="flex-1 bg-accent text-bg rounded px-3 py-2 text-sm font-medium hover:brightness-110 transition"
                  onClick={() => setActiveModal(b.direction)}
                >
                  {b.label}
                </button>
              ))}
            </div>
            {syncMessage && <p className="text-xs text-muted font-mono">{syncMessage}</p>}
          </div>

          {error && <p className="text-sm text-danger">{error}</p>}

          <div className="space-y-2">
            {devices.map((d) => (
              <div key={d.device_id} className="bg-surface rounded-lg border border-hairline p-4 flex justify-between">
                <div>
                  <p className="font-medium">{d.device_name || d.device_id}</p>
                  <p className="text-xs text-muted font-mono">Last sync: {d.last_sync_at || "Never"}</p>
                </div>
                {d.pending_changes > 0 && (
                  <span className="text-xs bg-accent/15 text-accent rounded-full px-2 py-1 self-start">
                    {d.pending_changes} pending
                  </span>
                )}
              </div>
            ))}
            {devices.length === 0 && !error && (
              <p className="text-sm text-muted/70">No devices have synced yet.</p>
            )}
          </div>

          {costs && (
            <div className="bg-surface rounded-lg border border-hairline p-4">
              <h3 className="text-sm font-medium text-muted mb-2">API spend</h3>
              <div className="flex items-baseline justify-between">
                <span className="text-2xl font-mono text-accent">${costs.total_cost_usd.toFixed(4)}</span>
                <span className="text-xs text-muted">{costs.calls} call{costs.calls === 1 ? "" : "s"} · {costs.period}</span>
              </div>
              {Object.keys(costs.by_model || {}).length > 0 && (
                <div className="mt-3 space-y-1">
                  {Object.entries(costs.by_model).map(([model, m]) => (
                    <div key={model} className="flex justify-between text-xs text-muted font-mono">
                      <span>{model}</span>
                      <span>{m.calls} calls · {m.input_tokens}in/{m.output_tokens}out · ${m.cost_usd.toFixed(4)}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          <div>
            <h3 className="text-sm font-medium text-muted mb-2">Import claude.ai export</h3>
            <ImportDropzone onImported={load} />
          </div>

          {activeModal && (
            <CredentialModal
              title={`Confirm ${activeModal}`}
              actionLabel={syncButtons.find((b) => b.direction === activeModal).label}
              onSubmit={handleSyncSubmit}
              onClose={() => setActiveModal(null)}
            />
          )}
        </div>
      );
    }

    function StatusFooter() {
      const [stats, setStats] = useState(null);
      const [health, setHealth] = useState(null);

      useEffect(() => {
        apiClient.getStats().then(setStats).catch(() => {});
        apiClient.getHealth().then(setHealth).catch(() => {});
      }, []);

      if (!stats) return null;

      return (
        <footer className="sticky bottom-0 bg-surface/95 backdrop-blur border-t border-hairline px-4 py-2 text-xs text-muted font-mono flex flex-wrap gap-x-4 gap-y-1 justify-center sm:justify-start">
          <span>{stats.total_sessions ?? 0} sessions indexed</span>
          <span>last sync: {stats.last_sync || "never"}</span>
          <span className={health?.healthy === false ? "text-danger" : "text-success"}>
            archive: {health?.healthy === false ? "unhealthy" : health ? "verified" : "…"}
          </span>
        </footer>
      );
    }

    function App() {
      const [unlocked, setUnlocked] = useState(
        () => window.localStorage.getItem(LOCAL_STORAGE_KEY) === "true"
      );
      const [view, setView] = useState("search");

      const handleLock = () => {
        window.localStorage.removeItem(LOCAL_STORAGE_KEY);
        window.sessionStorage.removeItem(SESSION_PASSPHRASE_KEY);
        setUnlocked(false);
      };

      if (!unlocked) {
        return <SetupPage onUnlocked={() => setUnlocked(true)} />;
      }

      return (
        <div className="min-h-screen flex flex-col">
          <Header view={view} onNavigate={setView} onLock={handleLock} />
          <div className="flex-1">
            {view === "search" ? <SearchPage /> : <DevicesPage />}
          </div>
          <StatusFooter />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
