name: Tests

# Runs on windows-latest, not ubuntu-latest, deliberately: the project's
# real dev/deploy platform is Windows (see CLAUDE.md's Tech Stack table -
# vendor/cr-sqlite's vendored binary is a Windows x86_64 DLL). Testing on
# Linux would silently exercise storage.py's plain-SQLite fallback path
# on every run instead of the real CRDT path this project actually ships
# with, which would be false confidence, not real coverage.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --cov=src --cov-report=term-missing
